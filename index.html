
<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
    <title>Gedung Serbaguna BJP</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <style>
      /* ⬇️ Loading state styles */
      #root-loading {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
        font-family: 'Inter', sans-serif;
        background: #F9FAFB;
        margin: 0;
      }
      .loading-content {
        text-align: center;
        animation: fadeIn 0.5s ease-in;
      }
      .loading-icon {
        font-size: 56px;
        margin-bottom: 16px;
        display: block;
      }
      .loading-title {
        font-size: 20px;
        font-weight: 700;
        color: #1F2937;
        margin-bottom: 4px;
      }
      .loading-sub {
        font-size: 14px;
        color: #6B7280;
      }
      .loading-spinner {
        margin: 16px auto 0;
        width: 32px;
        height: 32px;
        border: 3px solid #E5E7EB;
        border-top-color: #2563EB;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
      }
    </style>
  </head>
  <body>
    <!-- ⬇️ Loading state shown while React loads -->
    <div id="root">
      <div id="root-loading">
        <div class="loading-content">
          <span class="loading-icon">🏛️</span>
          <div class="loading-title">Gedung Serbaguna BJP</div>
          <div class="loading-sub">Memuat aplikasi...</div>
          <div class="loading-spinner"></div>
        </div>
      </div>
    </div>
    
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
